{% extends "base.html" %}
{% block content %}
<h2>All Applications</h2>
<div class="table-responsive"><table class="table table-bordered bg-white">
<tr><th>Student</th><th>Email</th><th>Job</th><th>Company</th><th>Applied Date</th><th>Status</th></tr>
{% for a in apps %}<tr><td>{{ a.student }}</td><td>{{ a.email }}</td><td>{{ a.title }}</td><td>{{ a.company_name }}</td><td>{{ a.applied_at }}</td><td>{{ a.status }}</td></tr>
{% else %}<tr><td colspan="6">No applications yet.</td></tr>{% endfor %}
</table></div>
<a class="btn btn-secondary" href="{{ url_for('admin_dashboard') }}">Back to Dashboard</a>
{% endblock %}
