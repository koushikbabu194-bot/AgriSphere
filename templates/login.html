{% extends "base.html" %}
{% block title %}Login · Placement Portal{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
<div class="card shadow-sm"><div class="card-body p-4">
<h2 class="mb-4">Login</h2>
<form method="post">
  <label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
  <label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
  <button class="btn btn-primary w-100">Login</button>
</form>
<p class="mt-3 mb-0">New user? <a href="{{ url_for('register') }}">Create an account</a></p>
<hr><small class="text-muted">Admin demo: admin@placement.com / admin123</small>
</div></div></div></div>
{% endblock %}
